name: Validate repository

# Pull-request and main-branch gate for code, notebooks, generated-data
# manifests, projects, licensing, and documentation. It runs the strict site
# build but uploads nothing and requests no Pages permissions, so a fork PR or a
# direct push cannot publish or touch the live site.
#
# Deployment stays separate in deploy-pages.yml and waits for this workflow to
# succeed on main. This workflow is the mandatory CPU-only baseline: no GPU, no
# Hugging Face model download, no paid API, and no dataset generation. The
# generated manifests are checked only when data/ exists.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python:
    name: Python, notebooks, and data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate licensing files, scope, and notices
        run: python scripts/check_licensing.py

      - name: Test the manifest gate with a synthetic fixture
        run: python -m unittest tests.test_vision_manifests -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project specifications and assessment banks
        run: python scripts/check_course_projects.py

      - name: Validate generated vision manifests (SKIPPED when absent)
        run: python scripts/check_vision_manifests.py

      - name: Register the Python kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3.12 (CI)"

      - name: Validate notebook JSON and stored outputs
        run: python scripts/check_notebooks.py --validate

      - name: Execute notebooks on the CPU path
        run: python scripts/check_notebooks.py --execute --timeout 300

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/docs.txt

      - name: Check links, anchors, and navigation
        run: python scripts/check_docs_links.py

      - name: Build site (strict)
        run: python -m mkdocs build --strict

      - name: Check built site for project-prefix problems
        run: python scripts/check_docs_links.py --site site
