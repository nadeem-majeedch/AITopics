site_name: AITopics - Applied AI Engineering
site_description: >-
  A self-paced, hands-on course on training, fine-tuning, evaluating, and
  deploying language, vision, speech, video, and agentic AI systems.
site_author: Engr. Dr. Muhammad Nadeem Majeed

# GitHub Pages project site. The /AITopics/ prefix is part of the published URL:
# MkDocs writes relative links, so pages and assets resolve under the prefix.
# See docs/technical/GITHUB-PAGES.md before changing this value.
site_url: https://nadeem-majeedch.github.io/AITopics/

repo_url: https://github.com/nadeem-majeedch/AITopics
repo_name: nadeem-majeedch/AITopics
edit_uri: edit/main/docs/

copyright: >-
  Copyright (c) 2026 Muhammad Nadeem Majeed. Course licensing is described in
  the repository README.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nadeem-majeedch/AITopics

